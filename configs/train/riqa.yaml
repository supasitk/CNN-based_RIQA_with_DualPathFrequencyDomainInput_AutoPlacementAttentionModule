# run info
config_summary: 'DsEyeQsize224tr75tr25te100AugHVflipRot2e-1_Md1Bresnet50RGBimgnet_ExeSGDm9e-1nesF-LrFixInit1e-2-LossSCCElogitT-Bs32-DropRate0-Wd0-EpTr160Val1Save1-Seed0'

# dataset
dataset_name: 'EyeQ'  # ['EyeQ']
dataset_config_path: './configs/dataset/eyeq.yaml'

# model
model_structure: 'OneBranch_ThreeInputChannelRGB'    # ['OneBranch_ThreeInputChannelRGB']
model_config_path: './configs/model/OneBranch_ThreeInputChannelRGB.yaml'

# optimizer ['SGD']
# --- SGD --- #
optimizer: 'SGD'
optimizer_config:
  'momentum': 0.9
  'nesterov': False

# learning rate scheduler ['Fix', 'ExponentialDecay']
# --- Fix --- #
lr_schedule: 'Fix'
lr_config:
  'lr_init': !!float 1e-2
# --- ExponentialDecay --- #
#lr_schedule: 'ExponentialDecay' # 'decay_rate' parameter calculated from "(lr_min / lr_init) ** (1 / num_times_of_decay)""
#lr_config:
#  'lr_init': !!float 1e-2
#  'lr_min': !!float 1e-4
#  'decay_unit': 'epoch'     # 'epoch' or 'step' of decay
#  'decay_on_every_unit': 1
#  'staircase': True


# loss function ['SparseCategoricalCrossentropy']
# --- SparseCategoricalCrossentropy --- #
loss_fn: 'SparseCategoricalCrossentropy'    
loss_fn_config:
  'from_logits': True
  'reduction': 'sum_over_batch_size'


# training setting
batch_size: 32
dropout_rate: 0.0
weights_decay: null   # [null or float]
train_unit: 'epoch'     # 'epoch' or 'step' of training
max_train_unit: 160
val_unit: 'epoch'       # 'epoch' or 'step' of validation
val_on_every_unit: 1
val_last_k_accuracy: 5
save_unit: 'epoch'       # 'epoch' or 'step' of saving weight
save_on_every_unit: 1
seed: 0
