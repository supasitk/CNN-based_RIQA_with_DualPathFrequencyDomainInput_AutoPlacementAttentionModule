# run info
config_summary: 'Tr_DsEyeQsz224sc-1to1tr75tr25te100AugHVflipRot2e-1TrOSf_Md1Bresnet50RGBnoPreW_AttnCA0b0-15_ExeSGDm9e-1nesF-LrFixInit1e-2-LossSCCElogitTcwF-Bs32-DropRate0-Wd0-EpTr160Val1LAFt5Save1-10s0'

# dataset
dataset_name: 'EyeQ'  # ['EyeQ']
dataset_config_path: './configs/dataset/eyeq.yaml'

# model
model_structure: 'OneBranch_ThreeInputChannelRGB'    # summary description of model structure
model_config_path: './configs/model/model.yaml'

# model attention
model_attention: 'Attn_OneBranch_ThreeInputChannelRGB'    # summary description of model attention
model_attention_config_path: './configs/model_attention/model_attention.yaml'

# optimizer ['SGD']
# --- SGD --- #
optimizer: 'SGD'
optimizer_config:
  'momentum': 0.9
  'nesterov': False

# learning rate scheduler ['Fix', 'ExponentialDecay', 'CosineDecay']
# --- Fix --- #
lr_schedule: 'Fix'
lr_config:
  'lr_init': !!float 1e-2
# --- ExponentialDecay --- #
#lr_schedule: 'ExponentialDecay' # 'decay_rate' parameter calculated from "(lr_min / lr_init) ** (1 / num_times_of_decay)""
#lr_config:
#  'lr_init': !!float 1e-2
#  'lr_min': !!float 1e-4
#  'decay_unit': 'epoch'     # 'epoch' or 'step' of decay
#  'decay_on_every_unit': 1
#  'staircase': True
# --- CosineDecay --- #
#lr_schedule: 'CosineDecay'
#lr_config:
#  'lr_init': !!float 1e-2
#  'lr_alpha': !!float 0.0    # minimum learning rate (lr_min) value for decay as a fraction of initial_learning_rate (lr_init),  
                              # lr_min=lr_alpha * lr_init, e.g., for lr_init=0.01 (1e-2), set lr_aplha=0.01 if lr_min=0.0001 (1e-4) needed 


# loss function ['SparseCategoricalCrossentropy', 'SparseCategoricalCrossentropyWithLabelSmoothing']
# --- SparseCategoricalCrossentropy --- #
loss_fn: 'SparseCategoricalCrossentropy'    
loss_fn_config:
  'from_logits': True
  'reduction': 'sum_over_batch_size'
  'train_with_class_weight': False
# --- SparseCategoricalCrossentropyWithLabelSmoothing --- #
#loss_fn: 'SparseCategoricalCrossentropyWithLabelSmoothing'    
#loss_fn_config:
#  'from_logits': True
#  'reduction': 'sum_over_batch_size'
#  'train_with_class_weight': False
#  'label_smoothing': 0.1

# training setting
batch_size: 32
dropout_rate: 0.0
weights_decay: null   # [null or float]
train_unit: 'epoch'     # 'epoch' or 'step' of training
max_train_unit: 160
val_unit: 'epoch'       # 'epoch' or 'step' of validation
val_on_every_unit: 1
val_metrics_for_find_top_N_val: ['Loss', 'Accuracy', 'macroF1'] # metrics ['Loss', 'Accuracy', 'macroF1'] of validation used for find top-N validation (each metric considered separately)
val_top_N: 5            # top-N validation recorded on each metric in 'val_metrics_for_find_top_N_val' 
val_last_k_metrics: 5
save_unit: 'epoch'       # 'epoch' or 'step' of saving weight
save_on_every_unit: 1
seed_num: 10     # number of seed used
seed_start: 0   # start seed number (execution run 'seed_num' times with different seeds: 'seed_start', 'seed_start'+1, 'seed_start'+2, ..., 'seed_start'+'seed_num'-1)