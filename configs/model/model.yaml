# Model configuration

# Input into model
input_types_for_model: ['RGB']      # list of input type(s) for model (supported types are ['RGB']),
                                    # the input type(s) are concatenated (IN ORDER as the list) to one input tensor for model, 
                                    # so each branch of model will gather subset of channels from the tensor for its execution
number_of_input_channel: 3          # number of input channel of data (input) tensor for the model (must be equal to 'summation of number of channel for each input type')

# Model details
#-- Number of branch
number_of_branch: 1     # number of model's branch(es)

#-- Input of branch(es)
indices_of_input_channel_for_branches:    # indices of input channel(s) for each branch(es) [#elements must be equal to 'number_of_branch'] 
  1: [0,1,2]

#-- Resize input of branch(es)
resized_dim_of_input_for_branches:        # Dimension of resized input for each branch(es) [#elements must be equal to 'number_of_branch'] 
  1: 224                                  # (doing resize input on any branch#N if 'resize_dim_of_input_for_branches[branch#N]' != 'resized_image_dim (input into the model)')

#-- Color space conversion of branch(es)
color_space_conversion_for_branches:      # color space conversion of input for each branch(es) [#elements must be equal to 'number_of_branch'] 
  1: null                                 # supported conversion are [null, 'YUV']                      

#-- DCT transformation of branch(es)      
dct_transformation_for_branches:  # DCT transformation of input for each branch(es) [#elements must be equal to 'number_of_branch'], if 'transform' == True, details of DCT transformation need to be specified 
                                  # supported DCT transformations (with arguments and their default value) are 
                                  # -- ['Depthwise_DCT2d' ('tile_size_x'[8], 'tile_size_y'[8], 'freq_component_set'[64], 
                                  #                        'freq_component_selection_of_each_channel' [dict with 2 keys: 
                                  #                           1. 'format' key ['freq_number', 'freq_code']  
                                  #                           2. 'channel' key is dict (for defining freq components selected for each channel) with key-value pair for each channel:
                                  #                              2.1 (key) channel_number (integer)
                                  #                              2.2 (value) if 'freq_number' used, "list of integer (freq component)" must be given
                                  #                                          if 'freq_code' used, dict with key 'code' and 'config'  must be given: 
                                  #                                             2.2.1 if key 'code' = 'all', key 'config' = null (all frequency components selected)
                                  #                                             2.2.2 if key 'code' = 'low', key 'config' = number of selected frequency components (N: integer) [lowN: freq 0 - (N-1)]
                                  #                                             2.2.3 if key 'code' = 'high', key 'config' = number of selected frequency components (N: integer) [highN: freq (last-N+1) to last]
                                  #                                             2.2.4 if key 'code' = 'step', key 'config' = step size of selecting frequency components starting from 0 (S: integer) [stepS: freq 0,S,2S,3S,4S,5S,...]
                                  #                                             2.2.5 if key 'code' = 'band', key 'config' = list consists number of freq band and number of selected freq for each band 
                                  #                                                   2.2.5.1 if 'number of selected freq for each band' is interger (every band uses same number of freq) (list: [B: integer, N: integer] by N <= (F/B) if F = #Freq) [BbandN: freq 0, ... , (N-1),
                                  #                                                                                                                                                                                                                               (F/B), ..., (F/B)+(N-1),
                                  #                                                                                                                                                                                                                              2(F/B), ..., 2(F/B)+(N-1),]
                                  #                                                                                                                                                                                                                              .........................,]
                                  #                                                                                                                                                                                                                            B-1(F/B), ..., B-1(F/B)+(N-1)]
                                  #
                                  #                                                   2.2.5.2 if 'number of selected freq for each band' is list of integer (each band might use different number of freq) (list: [B: integer, [N0, N1, ..., Nb-1]: list of integer] by every Nb <= (F/B) if F = #Freq) [Bband[N0->b-1]: freq 0, ... , ({N0}-1),
                                  #                                                                                                                                                                                                                                                                                       (F/B), ..., (F/B)+({N1}-1),
                                  #                                                                                                                                                                                                                                                                                      2(F/B), ..., 2(F/B)+({N2}-1),]
                                  #                                                                                                                                                                                                                                                                                      ............................,]
                                  #                                                                                                                                                                                                                                                                                    B-1(F/B), ..., B-1(F/B)+({Nb-1}-1)]
                                  #                        'num_selected_freq_component_of_each_channel' [list of number of selected freq component of each channel, e.g., [64, 64, 64] for 3 channels])]
                                  #                        'normalize' [null or '<dict_stats_of_normalization>']
  1: {
      'transform': False,
      'transform_infos': null
     }
