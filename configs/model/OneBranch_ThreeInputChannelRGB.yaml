# Model configuration of Single-Branch with Input Channel "RGB"

# Input channel
number_of_input_channel: 3                  # number of input channel of dataset for the model
indices_of_input_channel_for_branches:      # indices of input channel(s) for each branch(es), 
  1: [0,1,2]                                # (#elements must be equal to 'number_of_branch')

# Branch detail
number_of_branch: 1                 # number of model's branch(es)

name_of_branches:                   # name of model's branch(es) (#elements must be equal to 'number_of_branch')
  1: 'ResNet50_RGB'

model_of_branches:                  # Neural network for branch(es) (#elements must be equal to 'number_of_branch') 
  1: 'ResNet'                       # Supported neural network(s) are ['ResNet']

numLayer_of_branches:               # Number of layer(s) of the network for branch(es) (#elements must be equal to 'number_of_branch')
  1: 50                             # if 'ResNet', supported number of layer(s) are [18, 34, 50, 101, 152]

pretrainedWeight_of_branches:       # Pretrained weight for branch(es) (#elements must be equal to 'number_of_branch')
  1: 'imagenet2012'                 # if 'ResNet', supported pretrained weight are [null, 'imagenet2012']