# run info
config_summary: 'TrS_DartUnrolledF_DsEyeQsz224sc-1to1normFtrP0.5valFtrP0.5AugHVflipRot2e-1TrOSf_Md1Bresnet50RGBnoPreW_AttnS3typeSkip-SEr8_16_32-Spa0k1_3_ExeOpSGDm9e-1nesF-LrFixI1e-2-OpSadam1B5e-1_2B999e-3-LrSfixI6e-4-LossSCCElogitTcwF-Bs32-Dr0-Wd0-Gclip5-WdS1e-3-GclipSn-EpTr90Search9LAFKt5Save1-5s0'

# dataset
dataset_name: 'EyeQ'  # ['EyeQ']
dataset_config_path: './configs/dataset/eyeq.yaml'

# model
model_structure: 'OneBranch_ThreeInputChannelRGB'    # summary description of model structure
model_config_path: './configs/model/model.yaml'

# model attention search
model_attention_search: 'SearchAttn_OneBranch_ThreeInputChannelRGB'    # summary description of model attention search
model_attention_search_config_path: './configs/model_attention_search/model_attention_search.yaml'

# algorithm of architecture search ['DARTS']
# --- DARTS --- #
arch_algorithm: 'DARTS'
arch_algorithm_config:
  'unrolled': False   # whether to use one-step unrolled validation loss 

# optimizer ['SGD']
# --- SGD --- #
optimizer: 'SGD'
optimizer_config:
  'momentum': 0.9
  'nesterov': False
# --- Adam --- #
#optimizer: 'Adam'
#optimizer_config:
#  'beta_1': 0.9
#  'beta_2': 0.999

# learning rate scheduler ['Fix', 'ExponentialDecay', 'CosineDecay']
# --- Fix --- #
lr_schedule: 'Fix'
lr_config:
  'lr_init': !!float 1e-2
# --- ExponentialDecay --- #
#lr_schedule: 'ExponentialDecay' # 'decay_rate' parameter calculated from "(lr_min / lr_init) ** (1 / num_times_of_decay)""
#lr_config:
#  'lr_init': !!float 1e-2
#  'lr_min': !!float 1e-4
#  'decay_unit': 'epoch'     # 'epoch' or 'step' of decay
#  'decay_on_every_unit': 1
#  'staircase': True
# --- CosineDecay --- #
#lr_schedule: 'CosineDecay'
#lr_config:
#  'lr_init': !!float 1e-2
#  'lr_alpha': !!float 0.0    # minimum learning rate (lr_min) value for decay as a fraction of initial_learning_rate (lr_init),  
                              # lr_min=lr_alpha * lr_init, e.g., for lr_init=0.01 (1e-2), set lr_aplha=0.01 if lr_min=0.0001 (1e-4) needed 
# --- PiecewiseConstantDecay --- #
#lr_schedule: 'PiecewiseConstantDecay'
#lr_config:
#  'lr_values': [0.01, 0.005, 0.0025]
#  'lr_boundaries': [80, 120]
#  'lr_boundaries_unit': 'epoch'  # 'epoch' or 'step'

# optimizer of architecture search ['Adam']
# --- Adam --- #
arch_optimizer: 'Adam'
arch_optimizer_config:
  'beta_1': 0.5
  'beta_2': 0.999

# learning rate scheduler of architecture search ['Fix']
# --- Fix --- #
arch_lr_schedule: 'Fix'
arch_lr_config:
  'lr_init': !!float 6e-4

# loss function ['SparseCategoricalCrossentropy', 'SparseCategoricalCrossentropyWithLabelSmoothing']
# --- SparseCategoricalCrossentropy --- #
loss_fn: 'SparseCategoricalCrossentropy'    
loss_fn_config:
  'from_logits': True
  'reduction': 'sum_over_batch_size'
  'train_with_class_weight': False
# --- SparseCategoricalCrossentropyWithLabelSmoothing --- #
#loss_fn: 'SparseCategoricalCrossentropyWithLabelSmoothing'    
#loss_fn_config:
#  'from_logits': True
#  'reduction': 'sum_over_batch_size'
#  'train_with_class_weight': False
#  'label_smoothing': 0.1

# training setting
batch_size: 32
weights_decay: null   # [null or float]
grad_clip_norm: 5.0  # [null or float]
arch_weights_decay: !!float 1e-3   # [null or float]
arch_grad_clip_norm: null  # [null or float]
train_unit: 'epoch'     # 'epoch' or 'step' of training
max_train_unit: 90
start_arch_search_train_unit: 9
arch_metrics_for_find_top_N_arch_search: ['Loss', 'Accuracy', 'macroF1', 'QWK'] # metrics ['Loss', 'Accuracy', 'macroF1', 'QWK'] of arch_search used for find top-N arch_search (each metric considered separately)
arch_top_N: 5
arch_last_k_metrics: 5
save_unit: 'epoch'       # 'epoch' or 'step' of saving weight
save_on_every_unit: 1
seed_num: 5     # number of seed used
seed_start: 0   # start seed number (execution run 'seed_num' times with different seeds: 'seed_start', 'seed_start'+1, 'seed_start'+2, ..., 'seed_start'+'seed_num'-1)