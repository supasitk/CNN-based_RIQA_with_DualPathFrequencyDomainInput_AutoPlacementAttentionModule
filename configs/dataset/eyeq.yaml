# EyeQ dataset's configuration

# Directories and files of EyePACS
original_dataset_root_dir: '/sk/DNN/dataset_for_run/retinal_image/EyePACS/'   # root directory of EyePACS dataset
original_dataset_train_dir_name: 'train'                              # name of directory under the 'original_dataset_root_dir' directory containing 'train' images of EyePACS dataset 
original_dataset_val_dir_name: 'train'                                # name of directory under the 'original_dataset_root_dir' directory containing 'validation' images of EyePACS dataset
original_dataset_test_dir_name: 'test'                                # name of directory under the 'original_dataset_root_dir' directory containing 'test' images of EyePACS dataset

# Directories and files of EyeQ
dataset_root_dir: '/sk/DNN/dataset_for_run/retinal_image/EyeQ/'   # root directory of EyeQ dataset

dataset_preprocessed_dir_name: 'preprocessed_img'         # name of directory under the 'dataset_root_dir' directory containing 'preprocessed train/test images for EyeQ' from the original images of EyePACS dataset
dataset_preprocessed_train_dir_name: 'train'              # name of directory under the 'dataset_preprocessed_dir_name' directory containing preprocessed 'train' images for EyeQ
dataset_preprocessed_val_dir_name: 'train'                # name of directory under the 'dataset_preprocessed_dir_name' directory containing preprocessed 'validation' images for EyeQ
dataset_preprocessed_test_dir_name: 'test'                # name of directory under the 'dataset_preprocessed_dir_name' directory containing preprocessed 'test' images for EyeQ

dataset_src_dir_name: 'src'                               # name of directory under the 'dataset_root_dir' directory containing the original source code of EyeQ
dataset_src_train_val_test_list_dir_name: 'data'          # name of directory under the 'dataset_src_dir_name' containing 'the name list of images of train/validation/test for EyeQ' from the original EyePACS dataset
dataset_src_train_list_filename: 'Label_EyeQ_train.csv'   # filename contains the name list of images of 'train' for EyeQ 
dataset_src_val_list_filename: 'Label_EyeQ_train.csv'     # filename contains the name list of images of 'validation' for EyeQ 
dataset_src_test_list_filename: 'Label_EyeQ_test.csv'     # filename contains the name list of images of 'test' for EyeQ

dataset_csv_info_column_name_of_image_filename: 'image'   # column name of csv file for filename of image
dataset_csv_info_column_name_of_image_label: 'quality'    # column name of csv file for label of image

# Dataset information
class_num: 3                                # Number of classes
class_name: ['Good', 'Usable', 'Reject']    # Name of classes (ID of class started with 0 from the first name)

# Data preprocessing
train_portion: 1.0            # ratio of training data used for training set, 
                              # training 'Fixed_NeuralNetwork_Architecture' should be '1.00' (using all training data), 
                              # while training 'Searching_NeuralNetwork_Architecture' can be specified from '0.0' to '1.0')
train_shuffle: True           # whether the training data shuffled before splitting to create the selected training set as 'train_portion'                              
val_from_train: True          # whether the validation data splitted from the selected training set
val_from_train_shuffle: True  # whether the selected training set shuffled before splitting to create the validation set
val_portion: 0.25             # split (val_portion * 100)% of the selected training set ([train_portion * 100]% of training data)
#-- Resize --#
resized_image_dim: 224        # Dimension of resized image for input to model
#-- Rescale --#
rescale_input_value: True     # whether rescaling input values to a new range, if True, details of rescale need to be specified 
rescale_input_value_range: 'minusOnetoOne'  # supported range(s) are 'ZerotoOne', 'minusOnetoOne'
#-- Normalization --#
normalization: False          # whether normalizing input values, if True, details of normalization need to be specified
normalization_stat:           # statistic of each input type(s) [number and name of elements must be same to 'input_types_for_model' of 'configs/model/model.yaml']
  'RGB': null                 # supported 'normalization_stat' of 'RGB' input type for model are [null, 'EyeQpreprocessedTrain_imgRGBresize224rescaleMinusOneToOne', 'EyeQpreprocessedTrain_imgRGBresize448rescaleMinusOneToOne']
#  'RGB_wCLAHE': null          # supported 'normalization_stat' of 'RGB_wCLAHE' input type for model are [null]
#-- Augmentation --#
train_augment: True                     # whether the data augmentation for training data, if True, details of augment need to be specified
train_augment_hflip: True               # Random horizontal flipping
train_augment_vflip: True               # Random vertical flipping
train_augment_rotation: True            # Random rotation
train_augment_rotation_factor: 0.2      # Fraction of 2 Pi of rotation results in an output rotating by a random amount in the range [-20% * 2pi, 20% * 2pi]
#-- Random Oversampling --#
train_random_oversampling: False         # whether oversample the minority classes for training data, if True, details of random sampling need to be specified
#train_random_oversampling_type: 'WeightedProbabilityEveryClassOnEachBatch' # ['WeightedProbabilityEveryClassOnEachBatch' -> Each batch has number of input for each class as weighted probability defined]
#train_random_oversampling_weight: null  # for 'WeightedProbabilityEveryClassOnEachBatch', 'null' means uniform distribution across classes; otherwise 'list of probability for each class (in order)' is specified (sum need to be 1.0), e.g., [0.5, 0.3, 0.2] for 3 classes (weight[i] represents probability to sample from class[i])

